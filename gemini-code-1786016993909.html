<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telegram Pill-Shape Navigation with Firebase Auth</title>
<style>
    /* Reset and base styles */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
        background-color: #0f1419; 
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    /* Notification Toast (Smooth UI) */
    .toast {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(-100px);
        background: linear-gradient(135deg, #40a7e3, #1a2f42);
        color: #fff;
        padding: 12px 24px;
        border-radius: 30px;
        font-size: 14px;
        font-weight: 600;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        opacity: 0;
        transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        z-index: 1000;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .toast.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
    }

    /* Main Floating Pill Container */
    .bottom-nav {
        background-color: #1d2733; 
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 90%;
        max-width: 380px; 
        padding: 4px 6px; 
        border-radius: 40px; 
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        position: fixed;
        bottom: 30px;
    }

    /* Individual Navigation Items */
    .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 25%;
        padding: 6px 0; 
        border-radius: 30px; 
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        color: #ffffff;
    }

    /* Click Animation */
    .nav-item:active {
        transform: scale(0.92);
    }

    /* Active State Styling */
    .nav-item.active {
        background-color: #1a2f42; 
        color: #40a7e3; 
    }

    /* Icon Container */
    .icon-container {
        position: relative;
        margin-bottom: 2px;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
    }

    /* SVGs Styling */
    .nav-item svg {
        width: 22px; 
        height: 22px;
        fill: transparent;
        stroke: #ffffff;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: all 0.3s ease;
    }

    .nav-item.active svg {
        stroke: #40a7e3;
        fill: #40a7e3;
    }

    /* Specific Chats Icon Adjustment */
    .nav-item:not(.active) .chats-icon path {
        fill: #ffffff;
        stroke: none;
    }
    .nav-item.active .chats-icon path {
        fill: #40a7e3;
        stroke: none;
    }

    /* Text Label */
    .nav-label {
        font-size: 11px; 
        font-weight: 600;
        letter-spacing: 0.2px;
    }

    /* Profile Icon Circle */
    .profile-circle {
        width: 22px;
        height: 22px;
        background-color: #5cbb5c;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        font-size: 10px;
        font-weight: bold;
        transition: all 0.3s ease;
    }
</style>
</head>
<body>

    <!-- Notification Toast -->
    <div id="toast" class="toast">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <span id="toast-message">Login Successful!</span>
    </div>

    <nav class="bottom-nav">
        <!-- Chats -->
        <div class="nav-item active" onclick="setActive(this)">
            <div class="icon-container">
                <svg class="chats-icon" viewBox="0 0 24 24">
                    <path d="M12 3c5.5 0 10 3.58 10 8s-4.5 8-10 8c-1.24 0-2.43-.18-3.53-.5C5.55 21 2 21 2 21c1.33-2 1.67-4 1.5-5.5C2.58 14.15 2 12.63 2 11c0-4.42 4.5-8 10-8z"/>
                </svg>
            </div>
            <span class="nav-label">Chats</span>
        </div>

        <!-- Contacts (Badge Removed) -->
        <div class="nav-item" onclick="setActive(this)">
            <div class="icon-container">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M4 20c0-4 4-7 8-7s8 3 8 7"></path>
                </svg>
            </div>
            <span class="nav-label">Contacts</span>
        </div>

        <!-- Settings -->
        <div class="nav-item" onclick="setActive(this)">
            <div class="icon-container">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </div>
            <span class="nav-label">Settings</span>
        </div>

        <!-- Profile (Click to Login) -->
        <div class="nav-item" id="profile-tab" onclick="setActive(this)">
            <div class="icon-container">
                <div class="profile-circle" id="profile-initials">GO</div>
            </div>
            <span class="nav-label">Profile</span>
        </div>
    </nav>

    <!-- Normal UI Script -->
    <script>
        function setActive(clickedElement) {
            const items = document.querySelectorAll('.nav-item');
            items.forEach(item => {
                item.classList.remove('active');
            });
            clickedElement.classList.add('active');
        }

        function showNotification(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            
            toastMessage.textContent = message;
            toast.classList.add('show');

            // Hide after 3.5 seconds
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }
    </script>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBYUNUUIx_dbI7aWdLGh75fP8TNWuG0BWc",
            authDomain: "tech-namaz-5cca4.firebaseapp.com",
            projectId: "tech-namaz-5cca4",
            storageBucket: "tech-namaz-5cca4.firebasestorage.app",
            messagingSenderId: "589167805423",
            appId: "1:589167805423:web:49e3a92daeae9078906c1a"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // Handle Google Login on Profile Click
        const profileTab = document.getElementById('profile-tab');
        
        profileTab.addEventListener('click', () => {
            // Only trigger login if user is not already logged in
            if (!auth.currentUser) {
                signInWithPopup(auth, provider)
                    .then((result) => {
                        const user = result.user;
                        
                        // Extract first 2 letters of name for Profile circle
                        const nameParts = user.displayName ? user.displayName.split(" ") : ["User"];
                        let initials = nameParts[0].charAt(0);
                        if (nameParts.length > 1) {
                            initials += nameParts[1].charAt(0);
                        }
                        
                        document.getElementById('profile-initials').textContent = initials.toUpperCase();
                        
                        // Show Smooth UI Notification
                        showNotification(`Welcome, ${user.displayName}!`);
                    }).catch((error) => {
                        console.error("Error signing in: ", error);
                        showNotification("Login Failed. Please try again.");
                    });
            } else {
                // If already logged in, just show a welcome back toast
                showNotification(`Welcome back, ${auth.currentUser.displayName}!`);
            }
        });
    </script>
</body>
</html>
