<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Secure Login & Phone Auth</title>
<style>
    /* Reset and base styles */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    /* 1. KEYBOARD JUMP FIX - Rigid Body Lock */
    body { 
        background: #f4f7f6; 
        width: 100vw; 
        /* Height will be locked via JS, default to 100vh for desktop */
        height: 100vh; 
        position: fixed; top: 0; left: 0; 
        overflow: hidden; 
        display: flex; align-items: center; justify-content: center;
    }

    /* Notification Toast */
    .toast {
        position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
        background: linear-gradient(135deg, #f25c27, #e04a16); color: #fff; padding: 14px 28px;
        border-radius: 30px; font-size: 13px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase;
        box-shadow: 0 10px 25px rgba(242, 92, 39, 0.4);
        opacity: 0; transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1); z-index: 3000;
        display: flex; align-items: center; justify-content: center; gap: 10px; text-align: center; 
        white-space: nowrap; width: max-content; max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* CARD CONTAINER */
    .card-container {
        background: #ffffff; 
        width: 90%; max-width: 380px; padding: 40px 30px;
        border-radius: 30px; 
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        text-align: center;
        /* No absolute positioning needed anymore due to flex body */
        position: relative; overflow: hidden;
    }

    /* TYPOGRAPHY */
    .card-container h2 { color: #f25c27; font-size: 26px; font-weight: 900; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
    .card-container p { color: #222; font-size: 12px; font-weight: 800; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 0.5px; }

    /* SMOOTH INPUT ANIMATIONS */
    .input-section { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    .input-group { 
        position: relative; text-align: left; max-height: 60px; margin-bottom: 15px; opacity: 1; 
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); overflow: hidden;
    }
    .input-group.hidden-smooth { max-height: 0; margin-bottom: 0; opacity: 0; border: none; }
    
    .input-group input, .phone-input-wrapper input {
        width: 100%; background: #fdfdfd; border: 1.5px solid #eaeaea;
        padding: 14px 16px; border-radius: 12px; font-size: 14px; font-weight: 700;
        color: #333; outline: none; transition: all 0.3s ease; letter-spacing: 0.5px;
    }
    .input-group input:focus, .phone-input-wrapper:focus-within { border-color: #f25c27; background: #fff5f2; }
    .input-group input::placeholder, .phone-input-wrapper input::placeholder {
        text-transform: uppercase; font-weight: 800; color: #aaa; font-size: 12px; letter-spacing: 0.5px;
    }

    /* PHONE INPUT STYLING */
    .phone-input-wrapper {
        display: flex; align-items: center; background: #fdfdfd;
        border: 1.5px solid #eaeaea; border-radius: 12px;
        margin-bottom: 15px; overflow: hidden; transition: all 0.3s ease;
    }
    .phone-input-wrapper.hidden-smooth { max-height: 0; margin-bottom: 0; opacity: 0; border: none; padding: 0; }
    
    .country-code {
        padding: 14px 10px 14px 16px; color: #333; font-weight: 800; font-size: 14px;
        background: #f4f7f6; border-right: 1.5px solid #eaeaea;
    }
    .phone-input-wrapper input { border: none; border-radius: 0; flex: 1; padding: 14px 16px; background: transparent; }

    /* Hide arrows from number input */
    input[type="number"]::-webkit-outer-spin-button, 
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

    .forgot-pass {
        display: block; text-align: right; color: #f25c27; font-size: 11px; font-weight: 800; 
        text-decoration: none; margin-bottom: 20px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px;
    }

    /* BUTTONS */
    .primary-btn {
        width: 100%; background: #f25c27; color: #ffffff; border: none; margin-bottom: 10px;
        padding: 15px; border-radius: 12px; font-size: 14px; font-weight: 900;
        cursor: pointer; box-shadow: 0 8px 20px rgba(242, 92, 39, 0.3);
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        -webkit-tap-highlight-color: transparent; text-transform: uppercase; letter-spacing: 1px;
    }
    .primary-btn:active { transform: scale(0.96); box-shadow: 0 4px 10px rgba(242, 92, 39, 0.2); }
    .danger-btn { background: #dc3545; box-shadow: 0 8px 20px rgba(220, 53, 69, 0.3); }
    .danger-btn:active { box-shadow: 0 4px 10px rgba(220, 53, 69, 0.2); }
    .secondary-btn { background: #fdfdfd; color: #333; border: 1.5px solid #eaeaea; box-shadow: none; }
    .secondary-btn:active { transform: scale(0.96); }

    .create-account { 
        display: block; margin-top: 15px; color: #555; font-size: 12px; 
        font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .create-account span { color: #f25c27; font-weight: 900; }

    /* Divider */
    .divider { display: flex; align-items: center; text-align: center; margin: 25px 0 20px 0; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #eaeaea; }
    .divider span { padding: 0 10px; color: #777; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }

    /* SOCIAL LOGINS */
    .social-login { display: flex; justify-content: center; gap: 15px; }
    .social-btn {
        width: 45px; height: 45px; background: #ffffff; border: 1.5px solid #eaeaea;
        border-radius: 12px; display: flex; align-items: center; justify-content: center;
        cursor: pointer; transition: all 0.3s ease; -webkit-tap-highlight-color: transparent;
    }
    .social-btn:hover { background: #f9f9f9; border-color: #d0d0d0; transform: translateY(-2px); }
    .social-btn:active { transform: scale(0.92); }
    .social-btn svg { width: 20px; height: 20px; }

    /* DELETE MODAL */
    .custom-modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(10, 15, 20, 0.7); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        display: flex; align-items: center; justify-content: center;
        z-index: 4000; opacity: 1; transition: opacity 0.3s ease;
    }
    .custom-modal-overlay.hidden { display: none !important; opacity: 0; pointer-events: none; }
    .custom-modal {
        background: #ffffff; width: 85%; max-width: 340px; padding: 35px 25px;
        border-radius: 28px; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        text-align: center; transform: scale(1); transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .custom-modal h3 { color: #dc3545; font-size: 22px; font-weight: 900; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 1px; }
    .custom-modal p { color: #111; font-size: 13px; font-weight: 800; text-transform: uppercase; margin-bottom: 30px; letter-spacing: 0.5px; }
    .modal-actions { display: flex; gap: 12px; }
    .modal-btn { 
        flex: 1; padding: 14px; border-radius: 12px; font-size: 13px; font-weight: 900; 
        cursor: pointer; text-transform: uppercase; border: none; letter-spacing: 1px; transition: all 0.2s ease;
    }
    .modal-btn:active { transform: scale(0.95); }
    .cancel-btn { background: #f4f7f6; color: #555; }
    .confirm-delete-btn { background: #dc3545; color: #fff; box-shadow: 0 6px 15px rgba(220, 53, 69, 0.3); }

    .hidden { display: none !important; }
    
    /* HIDE RECAPTCHA PERMANENTLY */
    .grecaptcha-badge { visibility: hidden !important; display: none !important; }
</style>
</head>
<body>

    <!-- SCRIPT TO RIGIDLY LOCK BODY HEIGHT FOR MOBILE KEYBOARD -->
    <script>
        document.body.style.height = window.innerHeight + 'px';
    </script>

    <!-- Notification Toast -->
    <div id="toast" class="toast"><span id="toast-message">SUCCESS!</span></div>

    <!-- 1. MAIN CARD -->
    <div id="login-card-main" class="card-container">
        <h2 id="form-title">LOGIN HERE</h2>
        <p id="form-subtitle">WELCOME BACK YOU'VE BEEN MISSED!</p>

        <!-- EMAIL / PASSWORD SECTION -->
        <div id="email-section" class="input-section">
            <div class="input-group hidden-smooth" id="username-group">
                <input type="text" id="username-input" placeholder="FULL NAME">
            </div>
            <div class="input-group">
                <input type="email" id="email-input" placeholder="EMAIL ADDRESS">
            </div>
            <div class="input-group">
                <input type="password" id="password-input" placeholder="PASSWORD">
            </div>
            
            <a class="forgot-pass" id="forgot-pass-link">FORGOT YOUR PASSWORD?</a>
            <button id="email-auth-btn" class="primary-btn">SIGN IN</button>
            
            <div class="create-account" id="toggle-auth-mode">
                DON'T HAVE AN ACCOUNT? <span>REGISTER</span>
            </div>
        </div>

        <!-- PHONE NUMBER SECTION -->
        <div id="phone-section" class="input-section hidden">
            <div class="phone-input-wrapper" id="phone-input-wrapper">
                <span class="country-code">+91</span>
                <input type="number" id="phone-input" placeholder="98765 43210" oninput="if(this.value.length > 10) this.value = this.value.slice(0, 10);">
            </div>
            <div class="input-group hidden-smooth" id="otp-input-group">
                <input type="number" id="otp-input" placeholder="ENTER 6-DIGIT OTP" oninput="if(this.value.length > 6) this.value = this.value.slice(0, 6);">
            </div>
            
            <button id="send-otp-btn" class="primary-btn">SEND OTP</button>
            <button id="verify-otp-btn" class="primary-btn hidden">VERIFY & LOGIN</button>
            
            <div class="create-account" id="back-to-email-btn">
                USE EMAIL INSTEAD? <span>GO BACK</span>
            </div>
        </div>

        <!-- Invisible Recaptcha Container -->
        <div id="recaptcha-container"></div>

        <div class="divider">
            <span id="divider-text">OR CONTINUE WITH</span>
        </div>

        <!-- Social / Phone Buttons -->
        <div class="social-login">
            <button class="social-btn" id="google-login-btn" title="CONTINUE WITH GOOGLE">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            </button>
            <button class="social-btn" id="switch-to-phone-btn" title="CONTINUE WITH PHONE">
                <svg viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- 2. LOGGED IN DASHBOARD -->
    <div id="dashboard-card" class="card-container hidden">
        <h2>PROFILE</h2>
        <p id="user-display-name">LOADING...</p>
        <button id="logout-btn" class="primary-btn secondary-btn">LOG OUT</button>
        <div class="divider"><span>DANGER ZONE</span></div>
        <button id="open-delete-modal-btn" class="primary-btn danger-btn">DELETE ACCOUNT</button>
    </div>

    <!-- 3. CUSTOM DELETE ACCOUNT MODAL -->
    <div id="delete-modal" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <h3>WARNING</h3>
            <p>DELETE YOUR ACCOUNT PERMANENTLY?</p>
            <div class="modal-actions">
                <button class="modal-btn cancel-btn" id="cancel-delete-btn">CANCEL</button>
                <button class="modal-btn confirm-delete-btn" id="confirm-delete-btn">DELETE</button>
            </div>
        </div>
    </div>

    <!-- UI Scripts -->
    <script>
        let toastTimeout;
        function showNotification(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = message.toUpperCase(); 
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 4000); 
        }
        let isLoginMode = true; 
    </script>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, 
            signInWithEmailAndPassword, createUserWithEmailAndPassword, 
            onAuthStateChanged, signOut, deleteUser,
            updateProfile, sendEmailVerification, sendPasswordResetEmail,
            RecaptchaVerifier, signInWithPhoneNumber
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCQKH9j93yz_q6fGAZ4HCW9XZxcXELtRPg",
            authDomain: "asar-namaztracker.firebaseapp.com",
            projectId: "asar-namaztracker",
            storageBucket: "asar-namaztracker.firebasestorage.app",
            messagingSenderId: "868194462025",
            appId: "1:868194462025:web:56ef9b77e36aef1c365298"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // REDIRECT LISTENER
        getRedirectResult(auth).then((result) => {
            if (result) showNotification("GOOGLE LOGIN SUCCESS!");
        }).catch((error) => {
            if(error.code !== 'auth/redirect-cancelled-by-user') showNotification("GOOGLE LOGIN FAILED.");
        });

        // ----------------------------------------
        // AUTHENTICATION STATE
        // ----------------------------------------
        onAuthStateChanged(auth, (user) => {
            if (user) {
                if (user.emailVerified === false && user.providerData[0].providerId === 'password') {
                    document.getElementById('login-card-main').classList.remove('hidden');
                    document.getElementById('dashboard-card').classList.add('hidden');
                } else {
                    document.getElementById('login-card-main').classList.add('hidden');
                    document.getElementById('dashboard-card').classList.remove('hidden');
                    const displayInfo = user.displayName || user.email || user.phoneNumber || "VERIFIED USER";
                    document.getElementById('user-display-name').textContent = `LOGGED IN AS: ${displayInfo.toUpperCase()}`;
                }
            } else {
                document.getElementById('login-card-main').classList.remove('hidden');
                document.getElementById('dashboard-card').classList.add('hidden');
                // Reset Phone UI on logout
                resetPhoneUI();
            }
        });

        // ----------------------------------------
        // UI TOGGLE: EMAIL VS PHONE
        // ----------------------------------------
        document.getElementById('switch-to-phone-btn').addEventListener('click', () => {
            document.getElementById('email-section').classList.add('hidden');
            document.getElementById('phone-section').classList.remove('hidden');
            document.getElementById('form-title').textContent = "PHONE LOGIN";
            document.getElementById('form-subtitle').textContent = "WE WILL SEND YOU A 6-DIGIT OTP";
        });

        document.getElementById('back-to-email-btn').addEventListener('click', () => {
            document.getElementById('phone-section').classList.add('hidden');
            document.getElementById('email-section').classList.remove('hidden');
            document.getElementById('form-title').textContent = isLoginMode ? "LOGIN HERE" : "REGISTER HERE";
            document.getElementById('form-subtitle').textContent = isLoginMode ? "WELCOME BACK YOU'VE BEEN MISSED!" : "CREATE AN ACCOUNT TO SECURELY SAVE DATA";
            resetPhoneUI();
        });

        // ----------------------------------------
        // UI TOGGLE: LOGIN VS REGISTER (Email)
        // ----------------------------------------
        document.getElementById('toggle-auth-mode').addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            const usernameGroup = document.getElementById('username-group');
            if (isLoginMode) {
                document.getElementById('form-title').textContent = "LOGIN HERE";
                document.getElementById('form-subtitle').textContent = "WELCOME BACK YOU'VE BEEN MISSED!";
                document.getElementById('email-auth-btn').textContent = "SIGN IN";
                document.getElementById('forgot-pass-link').style.display = "block";
                document.getElementById('toggle-auth-mode').innerHTML = `DON'T HAVE AN ACCOUNT? <span>REGISTER</span>`;
                usernameGroup.classList.add('hidden-smooth'); 
            } else {
                document.getElementById('form-title').textContent = "REGISTER HERE";
                document.getElementById('form-subtitle').textContent = "CREATE AN ACCOUNT TO SECURELY SAVE DATA";
                document.getElementById('email-auth-btn').textContent = "CREATE ACCOUNT";
                document.getElementById('forgot-pass-link').style.display = "none";
                document.getElementById('toggle-auth-mode').innerHTML = `ALREADY HAVE AN ACCOUNT? <span>LOGIN</span>`;
                usernameGroup.classList.remove('hidden-smooth'); 
            }
        });

        // --------------// PHONE AUTHENTICATION LOGIC (+91)
        // ----------------------------------------
        let confirmationResultObj = null;

        function resetPhoneUI() {
            document.getElementById('phone-input-wrapper').classList.remove('hidden-smooth');
            document.getElementById('send-otp-btn').classList.remove('hidden');
            document.getElementById('otp-input-group').classList.add('hidden-smooth');
            document.getElementById('verify-otp-btn').classList.add('hidden');
            document.getElementById('send-otp-btn').disabled = false;
            document.getElementById('send-otp-btn').textContent = "SEND OTP";
            document.getElementById('phone-input').value = "";
            document.getElementById('otp-input').value = "";
        }

        function setupRecaptcha() {
            if (!window.recaptchaVerifier) {
                window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', { 'size': 'invisible' });
            }
        }

        document.getElementById('send-otp-btn').addEventListener('click', () => {
            const rawNumber = document.getElementById('phone-input').value;
            if (rawNumber.length !== 10) { showNotification("ENTER VALID 10-DIGIT NUMBER"); return; }

            const fullPhoneNumber = "+91" + rawNumber;
            setupRecaptcha();

            const btn = document.getElementById('send-otp-btn');
            btn.disabled = true; btn.textContent = "SENDING...";

            signInWithPhoneNumber(auth, fullPhoneNumber, window.recaptchaVerifier)
                .then((confirmationResult) => {
                    confirmationResultObj = confirmationResult;
                    showNotification("OTP SENT SUCCESSFULLY!");
                    
                    document.getElementById('phone-input-wrapper').classList.add('hidden-smooth');
                    btn.classList.add('hidden');
                    document.getElementById('otp-input-group').classList.remove('hidden-smooth');
                    document.getElementById('verify-otp-btn').classList.remove('hidden');
                }).catch((error) => {
                    console.error(error);
                    showNotification("OTP FAILED. TRY LATER.");
                    btn.disabled = false; btn.textContent = "SEND OTP";
                });
        });

        document.getElementById('verify-otp-btn').addEventListener('click', () => {
            const code = document.getElementById('otp-input').value;
            if (code.length < 6) { showNotification("ENTER 6-DIGIT OTP"); return; }
            
            const btn = document.getElementById('verify-otp-btn');
            btn.disabled = true; btn.textContent = "VERIFYING...";

            confirmationResultObj.confirm(code).then((result) => {
                showNotification("PHONE LOGIN SUCCESS!");
            }).catch((error) => {
                showNotification("INVALID OTP. TRY AGAIN.");
                btn.disabled = false; btn.textContent = "VERIFY & LOGIN";
            });
        });

        // ----------------------------------------
        // FORGOT PASSWORD LOGIC
        // ----------------------------------------
        document.getElementById('forgot-pass-link').addEventListener('click', async () => {
            const email = document.getElementById('email-input').value.trim();
            if (!email) { showNotification("ENTER EMAIL FIRST"); return; }
            try {
                await sendPasswordResetEmail(auth, email);
                showNotification("RESET LINK SENT!");
            } catch (error) {
                if (error.code === 'auth/invalid-email') showNotification("INVALID EMAIL.");
                else if (error.code === 'auth/user-not-found') showNotification("USER NOT FOUND.");
                else showNotification("ERROR SENDING LINK.");
            }
        });

        // ----------------------------------------
        // EMAIL / PASSWORD LOGIC
        // ----------------------------------------
        document.getElementById('email-auth-btn').addEventListener('click', async () => {
            const username = document.getElementById('username-input').value.trim();
            const email = document.getElementById('email-input').value.trim();
            const password = document.getElementById('password-input').value.trim();
            const btn = document.getElementById('email-auth-btn');

            if (!isLoginMode && !username) { showNotification("ENTER FULL NAME"); return; }
            if (!email || !password) { showNotification("ENTER EMAIL & PASSWORD"); return; }

            btn.disabled = true; btn.textContent = "PROCESSING...";

            try {
                if (isLoginMode) {
                    const userCredential = await signInWithEmailAndPassword(auth, email, password);
                    if (!userCredential.user.emailVerified) {
                        await signOut(auth);
                        showNotification("UNVERIFIED! CHECK INBOX.");
                    } else {
                        showNotification("LOGIN SUCCESS!");
                    }
                } else {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;
                    await updateProfile(user, { displayName: username });
                    await sendEmailVerification(user);
                    await signOut(auth);
                    
                    showNotification("LINK SENT! CHECK EMAIL.");
                    document.getElementById('toggle-auth-mode').click();
                }
            } catch (error) {
                if (error.code === 'auth/email-already-in-use') showNotification("EMAIL ALREADY EXISTS.");
                else if (error.code === 'auth/invalid-credential') showNotification("INVALID CREDENTIALS.");
                else if (error.code === 'auth/weak-password') showNotification("PASSWORD TOO SHORT.");
                else showNotification("AUTHENTICATION ERROR.");
            } finally {
                btn.disabled = false; btn.textContent = isLoginMode ? "SIGN IN" : "CREATE ACCOUNT";
            }
        });

        // ----------------------------------------
        // GOOGLE LOGIN
        // ----------------------------------------
        document.getElementById('google-login-btn').addEventListener('click', () => {
            showNotification("REDIRECTING...");
            signInWithRedirect(auth, provider);
        });

        // ----------------------------------------
        // LOGOUT LOGIC
        // ----------------------------------------
        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth).then(() => {
                showNotification("LOGGED OUT!");
                document.getElementById('password-input').value = ""; 
            });
        });

        // ----------------------------------------
        // CUSTOM MODAL DELETE
        // ----------------------------------------
        const deleteModal = document.getElementById('delete-modal');

        document.getElementById('open-delete-modal-btn').addEventListener('click', () => {
            deleteModal.classList.remove('hidden');
        });
        document.getElementById('cancel-delete-btn').addEventListener('click', () => {
            deleteModal.classList.add('hidden');
        });
        document.getElementById('confirm-delete-btn').addEventListener('click', () => {
            deleteModal.classList.add('hidden'); 
            const user = auth.currentUser;
            if (user) {
                deleteUser(user).then(() => {
                    showNotification("ACCOUNT DELETED.");
                }).catch((error) => {
                    if (error.code === 'auth/requires-recent-login') showNotification("RE-LOGIN TO DELETE.");
                    else showNotification("ERROR DELETING.");
                });
            }
        });

    </script>
</body>
