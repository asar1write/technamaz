<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namaz Tracker Login</title>
    <style>
        /* Basic Pill UI Styles */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .login-btn {
            padding: 15px 40px;
            border-radius: 50px; /* Pill Shape */
            background-color: #4285F4;
            color: white;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .status-message {
            margin-top: 20px;
            font-size: 16px;
            color: #333;
            text-align: center;
        }
    </style>
</head>
<body>

    <button id="googleLoginBtn" class="login-btn">Continue with Google</button>
    <div id="status" class="status-message"></div>

    <!-- Firebase SDK Modules (Updated to v12.17.1) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { 
            getAuth, 
            GoogleAuthProvider, 
            signInWithRedirect, 
            getRedirectResult, 
            onAuthStateChanged,
            setPersistence,
            browserLocalPersistence
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        // Aapki Firebase Details
        const firebaseConfig = {
            apiKey: "AIzaSyCQKH9j93yz_q6fGAZ4HCW9XZxcXELtRPg",
            authDomain: "asar-namaztracker.firebaseapp.com",
            projectId: "asar-namaztracker",
            storageBucket: "asar-namaztracker.firebasestorage.app",
            messagingSenderId: "868194462025",
            appId: "1:868194462025:web:56ef9b77e36aef1c365298"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const loginBtn = document.getElementById("googleLoginBtn");
        const statusDiv = document.getElementById("status");

        // Force Local Storage (Ye White Screen Error Fix Karega)
        setPersistence(auth, browserLocalPersistence)
            .then(() => {
                // Check if user is already logged in
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        loginBtn.style.display = "none";
                        statusDiv.innerHTML = `Login Successful!<br>Welcome, ${user.displayName}`;
                        
                        // Yahan aap apne Namaz Tracker ke dashboard par redirect kar sakte hain
                        // window.location.href = "dashboard.html"; 
                    }
                });
            })
            .catch((error) => {
                console.error("Persistence Setup Error:", error);
            });

        // Wapas aane par result check karna
        getRedirectResult(auth)
            .then((result) => {
                if (result) {
                    console.log("Logged in successfully");
                }
            }).catch((error) => {
                console.error("Redirect Login Error:", error);
                statusDiv.innerHTML = "Login failed: " + error.message;
            });

        // Button Click Handler
        loginBtn.addEventListener("click", () => {
            loginBtn.style.display = "none";
            statusDiv.innerHTML = "Redirecting to Google...";
            // Start the redirect login process
            signInWithRedirect(auth, provider);
        });
    </script>
</body>
</html>
