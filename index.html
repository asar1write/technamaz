<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Asar - HD Cartoon Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0f0f;
            --surface-color: #212121;
            --border-color: #383838;
            --text-main: #ffffff;
            --text-secondary: #aaa;
            --yt-red: #ff0000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* --- YouTube Style Header & Large Search Bar --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background-color: #0f0f0f;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
            gap: 20px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo-text span {
            color: var(--yt-red);
            background: rgba(255, 0, 0, 0.15);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* YouTube Style Prominent Search Bar */
        .search-container {
            display: flex;
            flex: 1;
            max-width: 650px;
            background: #121212;
            border: 1px solid #303030;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        .search-container:focus-within {
            border-color: #1c62b9;
        }

        .search-input {
            width: 100%;
            padding: 12px 24px;
            background: transparent;
            border: none;
            color: #ffffff !important; /* Text is now clearly visible */
            font-size: 16px;
            outline: none;
        }

        .search-input::placeholder {
            color: #888888;
        }

        .search-btn {
            background: #222222;
            border: none;
            border-left: 1px solid #303030;
            padding: 0 28px;
            cursor: pointer;
            fill: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .search-btn:hover {
            background: #333333;
        }

        .user-profile {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #ff0000;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(255,0,0,0.3);
        }

        /* --- Main Layout --- */
        .main-container {
            max-width: 1650px;
            margin: 0 auto;
            padding: 24px;
        }

        /* --- Redesigned Top Video Player --- */
        .active-player-section {
            display: none;
            background: var(--surface-color);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            border: 1px solid var(--border-color);
            animation: fadeInPlayer 0.3s ease;
        }

        @keyframes fadeInPlayer {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .player-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: #181818;
            border-bottom: 1px solid var(--border-color);
        }

        .playing-title-top {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 85%;
        }

        .close-player-btn {
            background: #333;
            color: white;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .close-player-btn:hover {
            background: var(--yt-red);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-footer-bar {
            display: flex;
            justify-content: flex-end;
            padding: 12px 20px;
            background: #181818;
            border-top: 1px solid var(--border-color);
        }

        .landscape-btn {
            background: var(--yt-red);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s, transform 0.2s;
        }

        .landscape-btn:hover {
            background: #cc0000;
            transform: scale(1.02);
        }

        /* --- Video Cards Grid --- */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
            row-gap: 40px;
        }

        .video-card {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: transform 0.25s ease;
        }

        .video-card:hover {
            transform: translateY(-5px);
        }

        .thumbnail-container {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 14px;
            overflow: hidden;
            position: relative;
            background: #1a1a1a;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        .thumbnail {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .video-card:hover .thumbnail {
            transform: scale(1.05);
        }

        .hd-badge {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            font-size: 11px;
            padding: 3px 6px;
            border-radius: 4px;
            font-weight: 700;
        }

        .card-details {
            display: flex;
            gap: 12px;
        }

        .channel-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .meta-text {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-main);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-channel {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .status-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px;
            color: var(--text-secondary);
            font-size: 18px;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            header { padding: 10px 15px; gap: 10px; }
            .search-input { padding: 10px 14px; font-size: 14px; }
            .main-container { padding: 15px; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo-area" onclick="fetchHomeFeed()">
            <svg height="22" viewBox="0 0 90 20" width="90"><path d="M27.9727 3.12324C27.6435 1.89335 26.6765 0.92633 25.4466 0.597168C23.2197 0 14.2857 0 14.2857 0C14.2857 0 5.35174 0 3.12482 0.597168C1.89493 0.92633 0.927914 1.89335 0.598752 3.12324C0 5.35016 0 10 0 10C0 10 0 14.6498 0.598752 16.8768C0.927914 18.1067 1.89493 19.0737 3.12482 19.4028C5.35174 20 14.2857 20 14.2857 20C14.2857 20 23.2197 20 25.4466 19.4028C26.765 19.0737 27.6435 18.1067 27.9727 16.8768C28.5714 14.6498 28.5714 10 28.5714 10C28.5714 10 28.5714 5.35016 27.9727 3.12324Z" fill="#FF0000"/><path d="M11.4286 14.2857L18.8571 10L11.4286 5.71429V14.2857Z" fill="#FFFFFF"/></svg>
            <div class="logo-text">Tech<span>Asar</span></div>
        </div>

        <!-- Fully Visible Large Search Bar -->
        <div class="search-container">
            <input type="text" id="search-input" class="search-input" placeholder="डोरीमोन, मोटू-पतलू या कार्टून सर्च करें..." onkeypress="handleSearchKey(event)">
            <button class="search-btn" onclick="triggerSearch()">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
            </button>
        </div>

        <div class="user-profile">TA</div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        
        <!-- Redesigned Top Active Player Section -->
        <div class="active-player-section" id="active-player-section">
            <div class="player-top-bar">
                <div class="playing-title-top" id="playing-title-top">वीडियो शीर्षक</div>
                <button class="close-player-btn" onclick="closeActivePlayer()">&times;</button>
            </div>
            <div class="video-wrapper" id="video-wrapper">
                <iframe id="video-frame" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>
            </div>
            <div class="player-footer-bar">
                <button class="landscape-btn" onclick="rotateToLandscape()">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="white">
                        <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                    </svg>
                    फुलस्क्रीन / लैंडस्केप
                </button>
            </div>
        </div>

        <!-- Video Cards Grid -->
        <div class="video-grid" id="video-grid">
            <div class="status-message">वीडियो लोड हो रहे हैं...</div>
        </div>
    </div>

    <!-- JavaScript Engine -->
    <script>
        const API_KEY = 'AIzaSyBMyxZnLCVKqQQ-8Ph1inSaVXb3DIUpKF0';
        
        const videoGrid = document.getElementById('video-grid');
        const activePlayerSection = document.getElementById('active-player-section');
        const videoFrame = document.getElementById('video-frame');
        const videoWrapper = document.getElementById('video-wrapper');
        const playingTitleTop = document.getElementById('playing-title-top');
        const searchInput = document.getElementById('search-input');

        // On Page Load - Fetch Doraemon in Hindi & Mixed cartoons
        window.onload = () => {
            fetchHomeFeed();
        };

        async function fetchHomeFeed() {
            searchInput.value = "";
            let mixedQuery = "\"Doraemon in Hindi\" OR \"Motu Patlu in Hindi\" OR \"Not Your Type\" OR \"Chhota Bheem\"";
            fetchVideos(mixedQuery);
        }

        async function fetchVideos(query) {
            videoGrid.innerHTML = '<div class="status-message">वीडियो खोजे जा रहे हैं...</div>';
            
            // Blocking shorts, songs, music
            const finalQuery = query + " -song -songs -music -dj -shorts";
            const API_URL = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=28&q=${encodeURIComponent(finalQuery)}&type=video&videoDuration=long&videoEmbeddable=true&safeSearch=strict&key=${API_KEY}`;

            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                renderVideos(data.items);
            } catch (error) {
                videoGrid.innerHTML = `<div class="status-message" style="color: #ff5555;">⚠️ एरर: ${error.message}</div>`;
            }
        }

        function renderVideos(videos) {
            videoGrid.innerHTML = '';
            if (!videos || videos.length === 0) {
                videoGrid.innerHTML = '<div class="status-message">कोई वीडियो नहीं मिला। दूसरा नाम सर्च करें।</div>';
                return;
            }

            videos.forEach(video => {
                if (!video.id.videoId) return;
                
                const videoId = video.id.videoId;
                const snippet = video.snippet;
                const title = snippet.title;
                const channelTitle = snippet.channelTitle;
                const randomColor = '#' + Math.floor(Math.random()*16777215).toString(16);

                const hdThumb = `https://i.ytimg.com/vi/${videoId}/maxresdefault.jpg`;
                const fallbackThumb = `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`;

                const cardHTML = `
                    <div class="video-card" onclick="playVideoAtTop('${videoId}', '${escapeHtml(title)}')">
                        <div class="thumbnail-container">
                            <img src="${hdThumb}" onerror="this.onerror=null; this.src='${fallbackThumb}'" class="thumbnail" alt="Thumbnail" loading="lazy">
                            <span class="hd-badge">HD</span>
                        </div>
                        <div class="card-details">
                            <div class="channel-avatar" style="background-color: ${randomColor}"></div>
                            <div class="meta-text">
                                <div class="card-title">${title}</div>
                                <div class="card-channel">${channelTitle}</div>
                            </div>
                        </div>
                    </div>
                `;
                videoGrid.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        function playVideoAtTop(videoId, title) {
            const currentOrigin = window.location.origin.includes("file://") ? "https://www.youtube.com" : window.location.origin;

            videoFrame.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&vq=hd1080&rel=0&modestbranding=1&enablejsapi=1&origin=${currentOrigin}`;
            
            playingTitleTop.innerText = title;
            activePlayerSection.style.display = 'block';
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closeActivePlayer() {
            videoFrame.src = ''; 
            activePlayerSection.style.display = 'none';
        }

        async function rotateToLandscape() {
            try {
                if (videoWrapper.requestFullscreen) await videoWrapper.requestFullscreen();
                else if (videoWrapper.webkitRequestFullscreen) await videoWrapper.webkitRequestFullscreen();
                
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock("landscape");
                }
            } catch (err) {
                console.warn("Fullscreen/Landscape restriction:", err);
            }
        }

        function triggerSearch() {
            let query = searchInput.value.trim();
            if (query) {
                // Automatically add Hindi context to search for better cartoons
                fetchVideos(query + " Hindi");
            }
        }

        function handleSearchKey(event) {
            if (event.key === 'Enter') {
                triggerSearch();
            }
        }

        function escapeHtml(text) {
            return text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
    </script>
</body>
    </html>
