<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Asar - Custom HTML5 Video Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0f0f;
            --surface-color: #181818;
            --border-color: #333333;
            --text-main: #ffffff;
            --text-secondary: #aaa;
            --accent-color: #ff0000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .player-container {
            width: 100%;
            max-width: 900px;
            background: var(--surface-color);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            border: 1px solid var(--border-color);
            position: relative;
        }

        /* --- Video Wrapper & Text Watermark Overlay --- */
        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Custom Pure Text Watermark Overlay */
        .video-watermark {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            pointer-events: none;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .video-watermark span {
            color: var(--accent-color);
        }

        /* --- Custom Controls Bar --- */
        .controls-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
            display: flex;
            flex-direction: column;
            padding: 10px 16px 14px 16px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 20;
        }

        .video-wrapper:hover .controls-bar,
        .controls-bar.active {
            opacity: 1;
        }

        /* Progress / Seek Bar */
        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            margin-bottom: 10px;
            transition: height 0.1s ease;
        }

        .progress-container:hover {
            height: 8px;
        }

        .progress-bar {
            height: 100%;
            background: var(--accent-color);
            border-radius: 3px;
            width: 0%;
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .progress-container:hover .progress-bar::after {
            opacity: 1;
        }

        /* Controls Inner Buttons & Time */
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .controls-left, .controls-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .ctrl-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            fill: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            transition: background 0.2s, transform 0.2s;
        }

        .ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.08);
        }

        .time-display {
            font-size: 13px;
            color: #f1f1f1;
            font-weight: 500;
            min-width: 90px;
        }

        /* Volume Slider */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .volume-slider {
            width: 70px;
            accent-color: var(--accent-color);
            cursor: pointer;
            height: 4px;
        }

        /* Big Play Center Overlay Button */
        .big-play-btn {
            position: absolute;
            width: 70px;
            height: 70px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            fill: #fff;
            transition: transform 0.2s, background 0.2s;
            z-index: 15;
        }

        .big-play-btn:hover {
            background: var(--accent-color);
            border-color: var(--accent-color);
            transform: scale(1.1);
        }

        .big-play-btn.hidden {
            display: none;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .volume-slider { width: 50px; }
            .time-display { font-size: 11px; }
            .ctrl-btn { width: 32px; height: 32px; }
        }
    </style>
</head>
<body>

    <div class="player-container" id="player-container">
        <div class="video-wrapper" id="video-wrapper">
            <!-- Native HTML5 Video Tag (No Third-Party iframes or branding) -->
            <video id="custom-video" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" preload="metadata"></video>

            <!-- Custom Pure Text Watermark Overlay -->
            <div class="video-watermark">
                Tech<span>Asar</span> Player
            </div>

            <!-- Center Big Play Button -->
            <div class="big-play-btn" id="big-play-btn">
                <svg viewBox="0 0 24 24" width="32" height="32">
                    <path d="M8 5v14l11-7z"/>
                </svg>
            </div>

            <!-- Custom Controls Bar -->
            <div class="controls-bar" id="controls-bar">
                <!-- Progress Bar -->
                <div class="progress-container" id="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>

                <div class="controls-row">
                    <div class="controls-left">
                        <!-- Play / Pause Button -->
                        <button class="ctrl-btn" id="play-pause-btn" title="Play/Pause">
                            <svg id="play-icon" viewBox="0 0 24 24" width="22" height="22"><path d="M8 5v14l11-7z"/></svg>
                            <svg id="pause-icon" viewBox="0 0 24 24" width="22" height="22" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                        </button>

                        <!-- Volume Controls -->
                        <div class="volume-container">
                            <button class="ctrl-btn" id="mute-btn" title="Mute/Unmute">
                                <svg id="volume-icon" viewBox="0 0 24 24" width="22" height="22"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                                <svg id="mute-icon" viewBox="0 0 24 24" width="22" height="22" style="display:none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                            </button>
                            <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.05" value="1">
                        </div>

                        <!-- Current Time / Total Time -->
                        <div class="time-display" id="time-display">0:00 / 0:00</div>
                    </div>

                    <div class="controls-right">
                        <!-- Fullscreen Toggle Button -->
                        <button class="ctrl-btn" id="fullscreen-btn" title="Fullscreen">
                            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Custom Player Controller Engine -->
    <script>
        const video = document.getElementById('custom-video');
        const videoWrapper = document.getElementById('video-wrapper');
        const playerContainer = document.getElementById('player-container');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const bigPlayBtn = document.getElementById('big-play-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const timeDisplay = document.getElementById('time-display');
        const muteBtn = document.getElementById('mute-btn');
        const volumeIcon = document.getElementById('volume-icon');
        const muteIcon = document.getElementById('mute-icon');
        const volumeSlider = document.getElementById('volume-slider');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const controlsBar = document.getElementById('controls-bar');

        let hideControlsTimeout;

        // Play / Pause Logic
        function togglePlay() {
            if (video.paused) {
                video.play();
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                bigPlayBtn.classList.add('hidden');
            } else {
                video.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                bigPlayBtn.classList.remove('hidden');
            }
        }

        playPauseBtn.addEventListener('click', togglePlay);
        bigPlayBtn.addEventListener('click', togglePlay);
        video.addEventListener('click', togglePlay);

        // Update Progress & Time Display
        video.addEventListener('timeupdate', () => {
            const current = video.currentTime;
            const duration = video.duration || 0;
            const percent = (current / duration) * 100;
            progressBar.style.width = `${percent}%`;

            timeDisplay.innerText = `${formatTime(current)} / ${formatTime(duration)}`;
        });

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Seek Video on Progress Bar Click
        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / progressContainer.clientWidth;
            video.currentTime = pos * video.duration;
        });

        // Volume & Mute Control
        volumeSlider.addEventListener('input', (e) => {
            video.volume = e.target.value;
            video.muted = video.volume === 0;
            updateVolumeIcons();
        });

        muteBtn.addEventListener('click', () => {
            video.muted = !video.muted;
            if (video.muted) {
                volumeSlider.value = 0;
            } else {
                volumeSlider.value = video.volume || 1;
            }
            updateVolumeIcons();
        });

        function updateVolumeIcons() {
            if (video.muted || video.volume === 0) {
                volumeIcon.style.display = 'none';
                muteIcon.style.display = 'block';
            } else {
                volumeIcon.style.display = 'block';
                muteIcon.style.display = 'none';
            }
        }

        // Fullscreen Toggle
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                if (playerContainer.requestFullscreen) {
                    playerContainer.requestFullscreen();
                } else if (playerContainer.webkitRequestFullscreen) {
                    playerContainer.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        });

        // Auto Hide Controls on Inactivity
        videoWrapper.addEventListener('mousemove', () => {
            controlsBar.classList.add('active');
            clearTimeout(hideControlsTimeout);
            hideControlsTimeout = setTimeout(() => {
                if (!video.paused) {
                    controlsBar.classList.remove('active');
                }
            }, 2500);
        });

        videoWrapper.addEventListener('mouseleave', () => {
            if (!video.paused) {
                controlsBar.classList.remove('active');
            }
        });
    </script>
</body>
</html>
