<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page - Firebase Auth</title>
<style>
    /* Reset and base styles */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    body { 
        background: #f4f7f6; /* Clean light background */
        height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; 
    }

    /* Notification Toast (Smooth UI) */
    .toast {
        position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
        background: linear-gradient(135deg, #f25c27, #e04a16); color: #fff; padding: 14px 28px;
        border-radius: 30px; font-size: 13px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase;
        box-shadow: 0 10px 25px rgba(242, 92, 39, 0.4);
        opacity: 0; transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1); z-index: 3000;
        display: flex; align-items: center; gap: 10px;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* Login Card Container */
    .login-card {
        background: #ffffff; 
        width: 90%; max-width: 380px; padding: 40px 30px;
        border-radius: 30px; 
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        text-align: center;
        position: relative; overflow: hidden;
    }

    .login-card h2 { color: #f25c27; font-size: 26px; font-weight: 800; margin-bottom: 8px; }
    .login-card p { color: #555555; font-size: 13px; font-weight: 600; margin-bottom: 25px; }

    /* Input Fields */
    .input-group { position: relative; margin-bottom: 15px; text-align: left; }
    .input-group input {
        width: 100%; background: #fdfdfd; border: 1.5px solid #eaeaea;
        padding: 14px 16px; border-radius: 12px; font-size: 14px; font-weight: 500;
        color: #333; outline: none; transition: all 0.3s ease;
    }
    .input-group input:focus { border-color: #f25c27; background: #fff5f2; }
    .input-group input::placeholder { color: #a0a0a0; }

    .forgot-pass {
        display: block; text-align: right; color: #f25c27; font-size: 11px;
        font-weight: 700; text-decoration: none; margin-bottom: 20px; cursor: pointer;
    }

    /* Main Action Button */
    .primary-btn {
        width: 100%; background: #f25c27; color: #ffffff; border: none;
        padding: 15px; border-radius: 12px; font-size: 15px; font-weight: 800;
        cursor: pointer; box-shadow: 0 8px 20px rgba(242, 92, 39, 0.3);
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        -webkit-tap-highlight-color: transparent;
    }
    .primary-btn:active { transform: scale(0.96); box-shadow: 0 4px 10px rgba(242, 92, 39, 0.2); }
    .primary-btn:disabled { background: #cccccc; box-shadow: none; cursor: not-allowed; }

    .create-account {
        display: block; margin-top: 15px; color: #555; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .create-account span { color: #f25c27; font-weight: 800; }

    /* Divider */
    .divider { display: flex; align-items: center; text-align: center; margin: 25px 0 20px 0; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #eaeaea; }
    .divider span { padding: 0 10px; color: #888; font-size: 11px; font-weight: 600; }

    /* Social Buttons */
    .social-login { display: flex; justify-content: center; gap: 15px; }
    .social-btn {
        width: 45px; height: 45px; background: #ffffff; border: 1.5px solid #eaeaea;
        border-radius: 12px; display: flex; align-items: center; justify-content: center;
        cursor: pointer; transition: all 0.3s ease; -webkit-tap-highlight-color: transparent;
    }
    .social-btn:hover { background: #f9f9f9; border-color: #d0d0d0; transform: translateY(-2px); }
    .social-btn:active { transform: scale(0.92); }
    .social-btn svg { width: 20px; height: 20px; }

    /* Hidden Sections */
    .hidden { display: none !important; }
</style>
</head>
<body>

    <!-- Notification Toast -->
    <div id="toast" class="toast">
        <span id="toast-message">Action Successful!</span>
    </div>

    <!-- Login Card -->
    <div class="login-card">
        <h2 id="form-title">Login here</h2>
        <p id="form-subtitle">Welcome back you've been missed!</p>

        <!-- EMAIL / PASSWORD SECTION -->
        <div id="email-section">
            <div class="input-group">
                <input type="email" id="email-input" placeholder="Email Address">
            </div>
            <div class="input-group">
                <input type="password" id="password-input" placeholder="Password">
            </div>
            <a class="forgot-pass" id="forgot-pass-link">Forgot your password?</a>
            <button id="email-auth-btn" class="primary-btn">Sign in</button>
            <div class="create-account" id="toggle-auth-mode">
                Don't have an account? <span>Register</span>
            </div>
        </div>

        <!-- PHONE NUMBER SECTION (Hidden by default) -->
        <div id="phone-section" class="hidden">
            <div class="input-group" id="phone-input-group">
                <input type="tel" id="phone-input" placeholder="+91 9876543210 (Country Code must)">
            </div>
            <div class="input-group hidden" id="otp-input-group">
                <input type="number" id="otp-input" placeholder="Enter 6-digit OTP">
            </div>
            
            <button id="send-otp-btn" class="primary-btn">Send OTP</button>
            <button id="verify-otp-btn" class="primary-btn hidden">Verify & Login</button>
            
            <div class="create-account" id="back-to-email">
                Use Email instead? <span>Go Back</span>
            </div>
        </div>

        <!-- Invisible Recaptcha for Phone Auth -->
        <div id="recaptcha-container"></div>

        <div class="divider">
            <span>Or continue with</span>
        </div>

        <!-- Social Logins -->
        <div class="social-login">
            <!-- Google Button -->
            <button class="social-btn" id="google-login-btn" title="Continue with Google">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            </button>
            <!-- Switch to Phone Auth Button -->
            <button class="social-btn" id="switch-to-phone-btn" title="Continue with Phone">
                <svg viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- UI Scripts -->
    <script>
        function showNotification(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }

        let isLoginMode = true; 
    </script>

    <!-- Firebase Script (Auth Only) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, signInWithPopup, GoogleAuthProvider, 
            signInWithEmailAndPassword, createUserWithEmailAndPassword, 
            RecaptchaVerifier, signInWithPhoneNumber, onAuthStateChanged, signOut
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCQKH9j93yz_q6fGAZ4HCW9XZxcXELtRPg",
            authDomain: "asar-namaztracker.firebaseapp.com",
            projectId: "asar-namaztracker",
            storageBucket: "asar-namaztracker.firebasestorage.app",
            messagingSenderId: "868194462025",
            appId: "1:868194462025:web:56ef9b77e36aef1c365298"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // ----------------------------------------
        // 1. EMAIL & PASSWORD LOGIC
        // ----------------------------------------
        document.getElementById('toggle-auth-mode').addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            document.getElementById('form-title').textContent = isLoginMode ? "Login here" : "Register here";
            document.getElementById('form-subtitle').textContent = isLoginMode ? "Welcome back you've been missed!" : "Create an account to securely save data";
            document.getElementById('email-auth-btn').textContent = isLoginMode ? "Sign in" : "Sign up";
            document.getElementById('forgot-pass-link').style.display = isLoginMode ? "block" : "none";
            document.getElementById('toggle-auth-mode').innerHTML = isLoginMode ? 
                `Don't have an account? <span>Register</span>` : `Already have an account? <span>Login</span>`;
        });

        document.getElementById('email-auth-btn').addEventListener('click', () => {
            const email = document.getElementById('email-input').value;
            const password = document.getElementById('password-input').value;

            if (!email || !password) {
                showNotification("PLEASE ENTER EMAIL & PASSWORD");
                return;
            }

            if (isLoginMode) {
                signInWithEmailAndPassword(auth, email, password)
                    .then(() => showNotification("LOGIN SUCCESSFUL!"))
                    .catch((error) => {
                        if (error.code === 'auth/invalid-credential') showNotification("INCORRECT EMAIL OR PASSWORD");
                        else showNotification(error.message);
                    });
            } else {
                createUserWithEmailAndPassword(auth, email, password)
                    .then(() => showNotification("ACCOUNT CREATED SUCCESSFULLY!"))
                    .catch((error) => {
                        if (error.code === 'auth/email-already-in-use') showNotification("EMAIL ALREADY EXISTS");
                        else if (error.code === 'auth/weak-password') showNotification("PASSWORD TOO WEAK");
                        else showNotification(error.message);
                    });
            }
        });

        // ----------------------------------------
        // 2. GOOGLE LOGIN LOGIC
        // ----------------------------------------
        document.getElementById('google-login-btn').addEventListener('click', () => {
            signInWithPopup(auth, provider)
                .then((result) => showNotification(`WELCOME, ${result.user.displayName.toUpperCase()}!`))
                .catch((error) => showNotification("GOOGLE LOGIN FAILED."));
        });

        // ----------------------------------------
        // 3. PHONE AUTHENTICATION LOGIC (NEW)
        // ----------------------------------------
        let confirmationResultObj = null;

        // Toggle Views Between Email & Phone
        document.getElementById('switch-to-phone-btn').addEventListener('click', () => {
            document.getElementById('email-section').classList.add('hidden');
            document.getElementById('phone-section').classList.remove('hidden');
            document.getElementById('form-title').textContent = "Phone Login";
            document.getElementById('form-subtitle').textContent = "We will send you an OTP";
        });

        document.getElementById('back-to-email').addEventListener('click', () => {
            document.getElementById('phone-section').classList.add('hidden');
            document.getElementById('email-section').classList.remove('hidden');
            document.getElementById('form-title').textContent = "Login here";
            document.getElementById('form-subtitle').textContent = "Welcome back you've been missed!";
        });

        // Initialize Recaptcha (Required for Phone Auth)
        window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
            'size': 'invisible'
        });

        // Send OTP
        document.getElementById('send-otp-btn').addEventListener('click', () => {
            const phoneNumber = document.getElementById('phone-input').value;
            // Phone number MUST contain country code, e.g., +91 for India
            if (phoneNumber.length < 10) {
                showNotification("ENTER VALID PHONE NUMBER WITH COUNTRY CODE (e.g. +91)");
                return;
            }

            document.getElementById('send-otp-btn').disabled = true;
            document.getElementById('send-otp-btn').textContent = "Sending...";

            signInWithPhoneNumber(auth, phoneNumber, window.recaptchaVerifier)
                .then((confirmationResult) => {
                    confirmationResultObj = confirmationResult;
                    showNotification("OTP SENT SUCCESSFULLY");
                    
                    // Hide Phone Input, Show OTP Input
                    document.getElementById('phone-input-group').classList.add('hidden');
                    document.getElementById('send-otp-btn').classList.add('hidden');
                    
                    document.getElementById('otp-input-group').classList.remove('hidden');
                    document.getElementById('verify-otp-btn').classList.remove('hidden');
                }).catch((error) => {
                    console.error(error);
                    showNotification("FAILED TO SEND OTP. TRY AGAIN.");
                    document.getElementById('send-otp-btn').disabled = false;
                    document.getElementById('send-otp-btn').textContent = "Send OTP";
                });
        });

        // Verify OTP
        document.getElementById('verify-otp-btn').addEventListener('click', () => {
            const code = document.getElementById('otp-input').value;
            if (code.length !== 6) {
                showNotification("PLEASE ENTER 6-DIGIT OTP");
                return;
            }

            confirmationResultObj.confirm(code).then((result) => {
                showNotification("PHONE LOGIN SUCCESSFUL!");
            }).catch((error) => {
                showNotification("INVALID OTP. PLEASE CHECK.");
            });
        });

        // ----------------------------------------
        // CHECK IF ALREADY LOGGED IN
        // ----------------------------------------
        onAuthStateChanged(auth, (user) => {
            if (user) {
                console.log("User is currently logged in:", user.uid);
                // IF you want to log them out automatically for testing, uncomment below:
                // signOut(auth);
            }
        });

    </script>
</body>
</html>
