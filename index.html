<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Asar - YouTube Kids & Cartoons</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --yt-black: #0f0f0f;
            --yt-surface: #212121;
            --yt-hover: #3f3f3f;
            --yt-border: #303030;
            --yt-text: #ffffff;
            --yt-text-secondary: #aaa;
            --yt-red: #ff0000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: var(--yt-black);
            color: var(--yt-text);
            overflow-x: hidden;
        }

        /* --- YouTube Header --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 24px;
            background-color: var(--yt-black);
            position: sticky;
            top: 0;
            z-index: 1000;
            height: 56px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .logo-box span {
            background-color: var(--yt-red);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Search Bar (Exact YouTube Style) */
        .search-area {
            display: flex;
            align-items: center;
            flex: 0.5;
            max-width: 600px;
        }

        .search-form {
            display: flex;
            width: 100%;
            background: #121212;
            border: 1px solid var(--yt-border);
            border-radius: 40px 0 0 40px;
            padding-left: 16px;
            overflow: hidden;
        }

        .search-form:focus-within {
            border-color: #1c62b9;
        }

        .search-input {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            font-size: 16px;
            height: 40px;
            outline: none;
        }

        .search-btn {
            background: var(--yt-surface);
            border: 1px solid var(--yt-border);
            border-left: none;
            padding: 0 24px;
            height: 40px;
            border-radius: 0 40px 40px 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            fill: var(--yt-text-secondary);
            transition: background 0.2s;
        }

        .search-btn:hover {
            background: var(--yt-hover);
            fill: white;
        }

        .header-icons {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .profile-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #26a69a;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        /* --- Category Pills (Chips Bar) --- */
        .chips-bar {
            display: flex;
            gap: 12px;
            padding: 12px 24px;
            overflow-x: auto;
            background: var(--yt-black);
            white-space: nowrap;
            scrollbar-width: none; /* Firefox */
        }
        .chips-bar::-webkit-scrollbar { display: none; } /* Chrome/Safari */

        .chip {
            background: var(--yt-surface);
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }

        .chip:hover, .chip.active {
            background: white;
            color: black;
        }

        /* --- Main Layout --- */
        .container {
            max-width: 1750px;
            margin: 0 auto;
            padding: 10px 24px 40px 24px;
        }

        /* --- Video Player Section --- */
        .player-section {
            display: none;
            margin-bottom: 30px;
            background: var(--yt-surface);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .video-box {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 */
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        .video-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .now-title {
            font-size: 18px;
            font-weight: 600;
            line-height: 1.4;
        }

        .landscape-btn {
            background: var(--yt-red);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 18px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }
        .landscape-btn:hover { background: #cc0000; }

        /* --- YouTube Video Grid --- */
        .grid-title {
            font-size: 20px;
            font-weight: 600;
            margin: 15px 0;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            row-gap: 35px;
        }

        .video-card {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .thumbnail-wrap {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 12px;
            overflow: hidden;
            background: #1a1a1a;
            position: relative;
        }

        .thumbnail {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.2s ease;
        }

        .video-card:hover .thumbnail {
            transform: scale(1.03);
            border-radius: 0;
        }

        .hd-tag {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            font-size: 10px;
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: bold;
        }

        .meta-info {
            display: flex;
            gap: 12px;
        }

        .channel-dp {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #555;
            flex-shrink: 0;
        }

        .details-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 500;
            color: var(--yt-text);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-channel {
            font-size: 13px;
            color: var(--yt-text-secondary);
        }

        .loader-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px;
            color: var(--yt-text-secondary);
            font-size: 16px;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .search-area { display: none; }
            header { padding: 10px 15px; }
        }
    </style>
</head>
<body>

    <!-- YouTube Navbar -->
    <header>
        <div class="logo-section" onclick="loadCategory('Motu Patlu')">
            <svg height="20" viewBox="0 0 90 20" width="90"><path d="M27.9727 3.12324C27.6435 1.89335 26.6765 0.92633 25.4466 0.597168C23.2197 0 14.2857 0 14.2857 0C14.2857 0 5.35174 0 3.12482 0.597168C1.89493 0.92633 0.927914 1.89335 0.598752 3.12324C0 5.35016 0 10 0 10C0 10 0 14.6498 0.598752 16.8768C0.927914 18.1067 1.89493 19.0737 3.12482 19.4028C5.35174 20 14.2857 20 14.2857 20C14.2857 20 23.2197 20 25.4466 19.4028C26.6765 19.0737 27.6435 18.1067 27.9727 16.8768C28.5714 14.6498 28.5714 10 28.5714 10C28.5714 10 28.5714 5.35016 27.9727 3.12324Z" fill="#FF0000"/><path d="M11.4286 14.2857L18.8571 10L11.4286 5.71429V14.2857Z" fill="#FFFFFF"/></svg>
            <div class="logo-box">Tech<span>Asar</span></div>
        </div>

        <!-- Search Bar -->
        <div class="search-area">
            <div class="search-form">
                <input type="text" id="search-input" class="search-input" placeholder="कार्टून खोजें (Motu Patlu, Bheem...)" onkeypress="handleKey(event)">
            </div>
            <button class="search-btn" onclick="executeSearch()">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
            </button>
        </div>

        <div class="header-icons">
            <div class="profile-icon">TA</div>
        </div>
    </header>

    <!-- Category Chips Bar -->
    <div class="chips-bar">
        <button class="chip active" onclick="loadCategory('Motu Patlu')">Motu Patlu</button>
        <button class="chip" onclick="loadCategory('Chhota Bheem')">Chhota Bheem</button>
        <button class="chip" onclick="loadCategory('Doraemon Hindi')">Doraemon</button>
        <button class="chip" onclick="loadCategory('Ssoftoons Cartoon')">Ssoftoons</button>
        <button class="chip" onclick="loadCategory('Kids Moral Stories Hindi')">Moral Stories</button>
        <button class="chip" onclick="loadCategory('Shiva Cartoon')">Shiva</button>
    </div>

    <!-- Main Container -->
    <div class="container">
        
        <!-- Video Player Section -->
        <div class="player-section" id="player-section">
            <div class="video-box" id="video-box">
                <iframe id="video-frame" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>
            </div>
            
            <div class="player-details">
                <div>
                    <div class="now-title" id="now-title">वीडियो लोड हो रहा है...</div>
                </div>
                <button class="landscape-btn" onclick="rotateToLandscape()">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="white">
                        <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                    </svg>
                    रोटेट (लैंडस्केप)
                </button>
            </div>
        </div>

        <div class="grid-title" id="grid-title">Motu Patlu & Top Cartoons</div>

        <!-- Video Cards Grid -->
        <div class="video-grid" id="video-grid">
            <div class="loader-msg">कार्टून लोड हो रहे हैं...</div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const API_KEY = 'AIzaSyBMyxZnLCVKqQQ-8Ph1inSaVXb3DIUpKF0';
        
        const videoGrid = document.getElementById('video-grid');
        const playerSection = document.getElementById('player-section');
        const videoFrame = document.getElementById('video-frame');
        const videoBox = document.getElementById('video-box');
        const nowTitle = document.getElementById('now-title');
        const searchInput = document.getElementById('search-input');
        const gridTitle = document.getElementById('grid-title');

        // Initial Load
        window.onload = () => {
            loadCategory('Motu Patlu');
        };

        // Fetch videos with filters to block songs and adults
        async function loadCategory(query) {
            gridTitle.innerText = `${query} - कार्टून वीडियो`;
            videoGrid.innerHTML = '<div class="loader-msg">वीडियो खोजे जा रहे हैं...</div>';
            
            // Highlight active chip
            document.querySelectorAll('.chip').forEach(btn => {
                if(btn.innerText.toLowerCase().includes(query.toLowerCase().split(' ')[0])) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            // Filtering out songs, music, and locking safe content
            const strictQuery = query + " cartoon -song -songs -music -dj -remix";
            const API_URL = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=24&q=${encodeURIComponent(strictQuery)}&type=video&videoEmbeddable=true&safeSearch=strict&key=${API_KEY}`;

            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                renderVideos(data.items);
            } catch (error) {
                videoGrid.innerHTML = `<div class="loader-msg" style="color: #ff5555;">⚠️ एरर: ${error.message}</div>`;
            }
        }

        function renderVideos(videos) {
            videoGrid.innerHTML = '';
            if (!videos || videos.length === 0) {
                videoGrid.innerHTML = '<div class="loader-msg">कोई वीडियो नहीं मिला।</div>';
                return;
            }

            videos.forEach(video => {
                if (!video.id.videoId) return;
                
                const videoId = video.id.videoId;
                const snippet = video.snippet;
                const title = snippet.title;
                const channelTitle = snippet.channelTitle;
                const randomColor = '#' + Math.floor(Math.random()*16777215).toString(16);

                // Crystal clear HD Thumbnails
                const hdThumb = `https://i.ytimg.com/vi/${videoId}/maxresdefault.jpg`;
                const fallbackThumb = `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`;

                const card = `
                    <div class="video-card" onclick="playVideo('${videoId}', '${escapeHtml(title)}')">
                        <div class="thumbnail-wrap">
                            <img src="${hdThumb}" onerror="this.onerror=null; this.src='${fallbackThumb}'" class="thumbnail" alt="thumbnail">
                            <span class="hd-tag">1080p HD</span>
                        </div>
                        <div class="meta-info">
                            <div class="channel-dp" style="background-color: ${randomColor}"></div>
                            <div class="details-text">
                                <div class="card-title">${title}</div>
                                <div class="card-channel">${channelTitle}</div>
                            </div>
                        </div>
                    </div>
                `;
                videoGrid.insertAdjacentHTML('beforeend', card);
            });
        }

        function playVideo(videoId, title) {
            const originUrl = window.location.origin.includes("file://") ? "https://www.youtube.com" : window.location.origin;
            
            // Error 153 fixed & 1080p forced
            videoFrame.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&vq=hd1080&rel=0&modestbranding=1&enablejsapi=1&origin=${originUrl}`;
            
            nowTitle.innerText = title;
            playerSection.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function rotateToLandscape() {
            try {
                if (videoBox.requestFullscreen) await videoBox.requestFullscreen();
                else if (videoBox.webkitRequestFullscreen) await videoBox.webkitRequestFullscreen();
                
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock("landscape");
                }
            } catch (err) {
                console.log("Fullscreen/Landscape restricted:", err);
            }
        }

        function executeSearch() {
            let query = searchInput.value.trim();
            if (query) {
                loadCategory(query);
            }
        }

        function handleKey(e) {
            if (e.key === 'Enter') executeSearch();
        }

        function escapeHtml(text) {
            return text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
    </script>
</body>
    </html>
